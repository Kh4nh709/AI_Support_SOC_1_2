<section id="case-notes">
  <h2>Ghi chú</h2>
  {% if note_error %}
  <p class="flash flash-error" data-field="note_error">{{ note_error }}</p>
  {% endif %}
  {% if notes %}
  <ul>
    {% for note in notes %}
    <li data-field="note">
      <span data-field="note_body">{{ note.body }}</span>
      — <span data-field="note_created_at">{{ note.created_at | local_time(tz) }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>Chưa có ghi chú.</p>
  {% endif %}
  <form id="note-form" hx-post="/cases/{{ case_id }}/notes" hx-target="#case-notes" hx-swap="outerHTML"
        method="post" action="/cases/{{ case_id }}/notes">
    <label for="note-body">Thêm ghi chú</label>
    <textarea id="note-body" name="body" required></textarea>
    <button type="submit">Lưu ghi chú</button>
  </form>
</section>
