<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Support SOC{% endblock %}</title>
<script src="{{ htmx_src }}"{% if htmx_integrity %} integrity="{{ htmx_integrity }}" crossorigin="anonymous"{% endif %}></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 0.5rem 1rem; background: #1f2937; color: #fff; }
  header a { color: #fff; text-decoration: none; }
  nav { display: flex; gap: 1rem; padding: 0.5rem 1rem; background: #f3f4f6; }
  main { padding: 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #d1d5db; padding: 0.4rem 0.6rem; text-align: left; }
  th { background: #f3f4f6; }
  pre { white-space: pre-wrap; word-break: break-word; }
  .flash { padding: 0.6rem 1rem; margin: 0 0 1rem; border-radius: 4px; }
  .flash-info { background: #dbeafe; color: #1e3a8a; }
  .flash-warn { background: #fef3c7; color: #92400e; }
  .flash-error { background: #fee2e2; color: #991b1b; }
  .band-low { background: #dcfce7; }
  .band-mid { background: #fef9c3; }
  .band-high { background: #fed7aa; }
  .band-crit { background: #fecaca; }
</style>
</head>
<body>
<header>
  <a href="/queue"><strong>AI Support SOC</strong></a>
  {% if user %}
  <div>
    <span>{{ user.username }} ({{ user.role }})</span>
    <form method="post" action="/logout" style="display:inline">
      <button type="submit">Đăng xuất</button>
    </form>
  </div>
  {% endif %}
</header>
<nav>
  <a href="/queue">Hàng đợi</a>
  {% if user and user.role == "admin" %}
  <a href="/admin/labels">Gán nhãn</a>
  {% endif %}
</nav>
<main>
  {% include "_flash.html" %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
