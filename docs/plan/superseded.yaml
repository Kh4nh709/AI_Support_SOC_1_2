# superseded.yaml — claims a decision has killed, and where they must not reappear.
#
# WHY. Four earlier attempts at the propagation problem — DEC-009's note, `Drafted by:`,
# `Propagated to:`, the manual sweep — all REPORT to a human; none DETECTS. `Propagated to:`
# is still a self-report: it lists what the author remembers editing. This file is enforced by
# backend/tests/test_superseded_claims.py, so a dead claim that comes back fails a test instead
# of waiting to be rediscovered when it bites a Coder. DEC-027.
#
# SCOPE IS NOT OPTIONAL. Only forward-looking artifacts are scanned (32 files today). Reports,
# reviews, audits, INBOX.md and DECISIONS.md are HISTORY and MUST still carry the old wording.
# Unscoped, "docker compose" matches 10 files and most are legitimate; scoped, five rules give
# five hits, all reviewable in a minute. A noisy linter is an ignored linter.
#
# STATUS
#   fixed → asserted hard. The regression guard the project did not have.
#   open  → xfails, so `make test` stays green while the backlog burns down. An open row that
#           PASSES shows up as an xpass: the debt is gone, flip it to `fixed`.
#   cleared → the debt was paid, but the pattern was a reminder anchor on live text (the DEC-052
#           repoint shape), so it can never become a guard: closed with a `cleared:` reason, not scanned.
#   Count remaining debt:  python3 -m pytest -c backend/pyproject.toml \
#                            backend/tests/test_superseded_claims.py -rs
#
# EXCEPTIONS. A live document may legitimately name a dead thing — migration 016 dropping
# `sampled_for_control`, a card telling a validator to reject `crown_jewel` by name, a note
# saying the `wazuh-indexer` service is inactive. Put on that line, the way noqa works:
#     <!-- superseded-ok: DEC-nnn short reason -->
# Visible and reviewable, never silent.
#
# TWO KINDS OF PATTERN. Rows seeded from the 2026-09-05 sweep carry long verbatim fragments:
# precise, but they only catch an exact re-paste. The hand-written `dec*-` rows carry the short
# canonical form of the dead claim and catch a paraphrase too — that layer found a bare `pytest`
# in reviewer.md's own checklist that the four-agent sweep had declared clean. Prefer the short
# form when adding a rule, and prove it fails before trusting it (DEC-025).
# An OPEN row whose pattern is longer than 50 characters must carry a `pattern_note` saying why
# (test_open_rows_with_long_patterns_carry_a_pattern_note, 07/09): DEC-052 showed a long quotation
# is retired by any edit to the text it quotes, a well-meant one included.
#
# LIMIT, stated plainly: this catches a RECORDED claim resurfacing. It cannot catch a new
# supersession nobody recorded. Only process covers that — see reviewer.md's checklist.

scan:
  include:
  - docs/plan/00-context-pack.md
  - docs/plan/01-plan.md
  - docs/plan/STATE.md
  - docs/plan/README.md
  - docs/plan/HUONG-DAN-VAN-HANH.md
  - docs/plan/prompts/*.md
  - docs/plan/tasks/*/*-tasks.md
  - docs/plan/tasks/*/*.prompt.md
  exclude_suffixes:
  - .report.md
  - .review.md
  - .audit.md
  exclude_names:
  - INBOX.md
  - DECISIONS.md
  - superseded.yaml
  # Completed phases leave the scope (DEC-049). A card for a merged task is not
  # forward-looking: no agent will act on it again, so a dead claim sitting in one
  # cannot mislead anybody. If a LIVE card ever copies text out of a retired one,
  # the copy lands in a live card and the canonical short-form rules fire there —
  # which is the right catch point. `test_scan_scope_tracks_completed_phases`
  # fails if this list disagrees with STATE.md's phase table in either direction.
  exclude_completed_phases:
  - P0
  - P1
