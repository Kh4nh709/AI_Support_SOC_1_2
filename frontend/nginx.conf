# The `ui` service (P10-T07): the built SPA on :80 and the same-origin proxy to the app.
# The CSP is the one of the spec §2 and is pinned verbatim by src/deploy.test.ts. `always` puts the
# three headers on error pages too.
server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The real-time channel (DEC-162): a WebSocket, so the upgrade headers and a long read timeout.
    location /api/ws {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
