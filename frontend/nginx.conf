# The `ui` service (P10-T07): the built SPA on :80 and the same-origin proxy to the app.
# The CSP is the one of the spec §2 and is pinned verbatim by src/deploy.test.ts. `always` puts the
# three headers on error pages too.
server {
    listen 80;
    root /usr/share/nginx/html;

    # The app's address changes whenever its container is recreated (`up -d app worker` after a build).
    # A literal host in proxy_pass is resolved once, when nginx starts, and every /api/ call then gets a
    # 502 until this container is restarted. So the upstream is a variable, which nginx resolves at request
    # time through Docker's embedded DNS, re-asked every 10 s. It also lets `ui` start while `app` is down.
    # (Ruling R9: a deviation from the brief's literal proxy_pass.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8000;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The real-time channel (DEC-162): a WebSocket, so the upgrade headers and a long read timeout.
    location /api/ws {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
    }

    # A hashed chunk of an old build is gone after a redeploy: that is a 404, never index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # The page is revalidated on every load so it always names the chunks that exist. nginx inherits
    # `add_header` into a location only when the location has none of its own, so the three security
    # headers are repeated here. src/deploy.test.ts checks every location that adds a header.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri /index.html;
    }
}
