# kb/decision_tables/credential_access.yaml — SKELETON, UNSIGNED. Content is the Owner's + advisor's (§11).
# reviewed_by/reviewed_at stay blank until that sitting; while blank the gate treats the table as absent
# (architecture §3.10), records decision_table_unreviewed:<category> in gate_result.warnings, and gate
# step 4 answers table_unreviewed — so ① never auto-closes a credential_access alert until it is signed.
#
# DRAFT 27/10/2026 — agent-drafted (S1, mapping v3.4), not reviewed — for the sitting to review, amend and
# sign. Windows LSASS credential dumping, MITRE ATT&CK T1003 / T1003.001 (rule 111923). Rules over the
# existing facts only; the access mask, the dumping tool and the .dmp path live in
# kb/playbooks/credential_access.md, never here (no new fact, no change to the table contract the signed
# tables were signed against). Evidence = kb/playbooks/credential_access.md by line. No fold is measured:
# gold_v1 holds no credential_access alert (implemented, not measured). The table has NO false_positive
# rule on purpose: nothing in these facts separates a registered security product or an admin's diagnostic
# dump (playbook :26-27) from a real dump — the access mask, the source image and the dump path are not
# facts — so a low alert is never auto-closed; the sitting may add one if it finds a structural precondition.
# apply_table is first match in file order; every two rules with different actions are disjoint on the
# 2,520-point grid (check_consistency returns []). No match -> B1 answers needs_review (docs/plan/prompts/P7.md:17).
category: credential_access
playbook: credential_access_v1
reviewed_by: ""
reviewed_at: ""
rules:
  # evidence: §3.10 pattern; playbook credential_access.md:38 (ioc_context malicious/suspicious on the process hash or a contacted IP) — kept because a malicious IoC is a G8′ hard block in every category. Alerts of this kind usually carry no IP, so this is rarely reachable (playbook :44)
  - id: cra-1
    if: {ioc_reputation: [malicious, suspicious]}
    then: escalate
  # evidence: §3.10 pattern; playbook credential_access.md:33 (a process that is not a security tool opens lsass.exe with a memory-read mask) + :34 (a known dump tool). No Windows rule reaching credential_access is verified at level >= 12 in this repo — for the signing sitting
  - id: cra-2
    if: {rule_level_gte: 12}
    then: escalate
  # evidence: playbook credential_access.md:33-36 (a confirmed LSASS read, the dump file, the stolen accounts reused elsewhere): the high band is where a rule that names a dump rather than a mere access sits — rule 111923's own level is NOT recorded in this repo, CONFIRM it against the rule file before signing. A successful dump exposes every account on the host (:45), so the band escalates rather than waits
  - id: cra-3
    if: {rule_level_gte: 8, rule_level_lt: 12}
    then: escalate
  # evidence: playbook credential_access.md:26-29 (a registered security product, an admin's diagnostic dump or a planned test can look the same) against :42-44 (an unknown or critical host, a privileged account, a missing lookup are not harmlessness): a low or medium alert never leaves the queue on its own. needs_review, not false_positive — the facts here cannot tell the benign cases apart
  - id: cra-4
    if: {severity: [low, medium], ioc_reputation: [not_found, clean, skipped]}
    then: needs_review
