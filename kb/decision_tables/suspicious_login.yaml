    then: false_positive
  # evidence: playbook suspicious_login.md:27 (a success from an IP with bad ioc_context). Fold: 0 of 174 — conf/iocs.csv is empty by design (65 not_found, 109 skipped); serves G2 and the pilot
  - id: sul-2
