rules:
  # evidence: This rule is the STRUCTURAL precondition under which an FP verdict is permitted (architecture §4: false_positive only on structural evidence the attacker cannot steer); the cited §3 branches are the text ① reads, not table facts. playbook web_attack.md:21 (the whole cluster is 404s on common scan paths), :22 (target application does not exist), :23 (legitimate search-engine bot); :37 (lookup missing -> not harmless) keeps ioc=skipped out. identity_privileged admits `unknown` because access-log alerts name no user (deviation from the §3.10 pattern, as in recon). (no archive clusters after DEC-055; no lab scenario.) Sheet §9 Q1
  - id: web-1
    if: {severity: [low, medium], ioc_reputation: [not_found, clean], asset_criticality: [low, medium],
         identity_privileged: ["false", "unknown"], occurrence_lt: 50}
    then: false_positive
  # evidence: playbook web_attack.md:16 (srcip + ioc_context; scanner IPs recur across threat-intel sources) — the playbook treats a bad IoC as a signal to check, and a malicious IoC is a G8′ hard block in every category. (no archive clusters after DEC-055; no lab scenario)
  - id: web-2
    if: {ioc_reputation: [malicious, suspicious]}
    then: escalate
  # evidence: §3.10 pattern; playbook web_attack.md:28 (a 200/500 on the very request carrying the payload — the server processed something), :30 (new file in the web root, or malware/c2_beacon from the same agent afterwards). (no archive clusters after DEC-055; no lab scenario)
