         identity_privileged: ["false"], occurrence_lt: 50}
    then: false_positive
  # evidence: playbook c2_beacon.md:15 (dstip + ioc_context; a domain registered within 30 days is its own signal), :29 (raw IP with no domain, or a just-registered domain). (no archive clusters — lab category)
  - id: c2b-2
