category: policy_violation
playbook: policy_violation_v1
reviewed_by: null
reviewed_at: null
rules:
  # evidence: This rule is the STRUCTURAL precondition under which an FP verdict is permitted (architecture §4: false_positive only on structural evidence the attacker cannot steer); the cited §3 branches are the text ① reads, not table facts. playbook policy_violation.md:21 (user holds an approved exception the rule does not know), :22 (banned software approved for that department), :23 (infrastructure change with a ticket); :25 — here false_positive means the RULE is wrong, not that nothing happened. (no archive clusters — no-signal category, DEC-057.) Sheet §10 Q1
  - id: pol-1
    if: {severity: [low, medium], ioc_reputation: [not_found, clean], asset_criticality: [low, medium],
         identity_privileged: ["false"], occurrence_lt: 50}
    then: false_positive
  # evidence: §3.10 pattern; playbook policy_violation.md:32 (another alert in the same window -> no longer a plain policy violation) is the nearest branch — no IoC line of its own; a malicious IoC is a G8′ hard block in every category. The sitting may strike it. (no archive clusters — no-signal category)
  - id: pol-2
    if: {ioc_reputation: [malicious, suspicious]}
    then: escalate
  # evidence: playbook policy_violation.md:29 (behaviour that reduces detection: AV off, logs deleted, monitoring stopped) — the archive's one such rule, 100112 "audit log cleared" (level 12, T1070), resolves `unknown` since DEC-055 and would land here only if the resolver ever reached this category. (no archive clusters — no-signal category)
  - id: pol-3
    if: {rule_level_gte: 12}
    then: escalate
  # evidence: playbook policy_violation.md:37 (critical host -> every change to protective configuration opens a case) + DEC-034 (high = the crown-jewel tier). (no archive clusters — no-signal category.) Sheet §10 Q2
  - id: pol-4
    if: {rule_level_gte: 8, rule_level_lt: 12, asset_criticality: [high]}
    then: escalate
  # evidence: playbook policy_violation.md:36 (a privileged violator is more serious — knows more and can do more) + :30 (installing tools usable for attack). (no archive clusters — no-signal category.) Sheet §10 Q2
  - id: pol-5
    if: {rule_level_gte: 8, rule_level_lt: 12, identity_privileged: ["true"]}
    then: escalate
