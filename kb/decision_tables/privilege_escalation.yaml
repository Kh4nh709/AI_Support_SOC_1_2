# review, amend and sign — nothing here is policy until reviewed_by is non-null. Evidence = the 30-day
# fold (3,070 clusters; this category 108, all in the G1 pool; DEC-086 samples 40 = 31 high · 1 medium ·
# 8 low) + kb/playbooks/privilege_escalation.md by line. Every one of the 108 clusters carries no IP, so
# ioc_reputation is `skipped` on all of them; sudo alerts name the TARGET account (data.dstuser=root ->
